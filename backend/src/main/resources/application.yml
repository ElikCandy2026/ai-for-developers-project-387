server:
  port: ${PORT:8080}
  compression:
    # Static assets and availability JSON are the largest responses. Tomcat
    # applies gzip only above min-response-size and only for these types.
    enabled: true
    mime-types: text/html,text/css,text/plain,text/xml,application/xml,application/json,application/javascript,text/javascript,image/svg+xml
    min-response-size: 1024
  error:
    include-message: never

spring:
  application:
    name: call-booking
  sql:
    init:
      mode: always
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  database-path: ${DB_PATH:./data/call-booking.db}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  owner:
    id: owner_pafnuty
    display-name: Пафнутий Евлампиевич
    email: pafnuty.evlampevich@callbook.local
    timezone: Europe/Moscow
    working-days:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
    workday-start: "10:00"
    workday-end: "19:00"
    slot-step-minutes: 30
    booking-window-days: 14
    booking-window-start-offset-days: 0
    minimum-notice-minutes: 0
    minimum-duration-minutes: 15
    maximum-duration-minutes: 240
