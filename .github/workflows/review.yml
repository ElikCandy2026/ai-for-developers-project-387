name: review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check review budget
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MAX_RUNS: "5"
          WORKFLOW_FILE: review.yml
        run: |
          set -euo pipefail
          # Count every review run for this PR branch, including the current one.
          # The count is checked before the model step, so the cap also applies
          # when earlier runs failed or were cancelled.
          runs=$(gh api --paginate \
            "repos/${GH_REPO}/actions/runs?event=pull_request&branch=${HEAD_REF}&per_page=100" \
            | jq --arg wf "${WORKFLOW_FILE}" -s \
              '[.[] | .workflow_runs[] | select(.path == (".github/workflows/" + $wf))] | length')
          echo "Review runs for ${HEAD_REF}: ${runs}/${MAX_RUNS} (including this run)"
          if [ "${runs}" -gt "${MAX_RUNS}" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Review run budget exhausted; the model will not be called."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run opencode review
        if: steps.budget.outputs.skip != 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # opencode/github@latest reads TOKEN, while its use_github_token
          # input only exports USE_GITHUB_TOKEN. Pass the same token under
          # both names so the action skips the actor permission check.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          use_github_token: true
          share: false
          prompt: |
            Ты — независимый ревьюер pull request в репозитории Callbook.
            Не меняй код, не создавай коммиты и ветки. Твоя задача — проверить
            diff PR и оставить один комментарий.

            1. Прочитай REVIEW.md в корне репозитория и применяй его критерии
               как чек-лист.
            2. Изучи только изменения PR относительно базовой ветки:
               `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`.
               При необходимости прочитай окружающий код и ADR.
            3. Проверь разделы PR «Проверки», «Риск» и «Откат». Если они пустые
               или не соответствуют diff, это блокирующее замечание.
            4. Начни комментарий строкой `<!-- opencode-auto-review -->`: по
               этому маркеру авторевью отличается от остальных комментариев.
            5. Формат: `## Авторевью`, затем `### Блокирующие` и
               `### Неблокирующие`. Для каждого замечания укажи `file:line`,
               суть и что исправить. Если замечаний нет, напиши это явно и
               перечисли проверенные критерии.
            6. Не пересказывай diff и не хвали автора. Пиши по-русски, кратко.
