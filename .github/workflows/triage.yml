name: triage

on:
  issues:
    types: [opened]
  # A failed run (model quota, network) can be retried for the same issue
  # without opening a duplicate.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string

jobs:
  triage:
    # Prepared tickets already carry a triage state label (to-tickets applies
    # ready-for-agent or ready-for-human), so they are skipped here. Only a
    # fresh issue from a maintainer reaches the model. A manual dispatch is an
    # explicit retry and bypasses the event filter.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.user.type != 'Bot' &&
        !endsWith(github.event.issue.user.login, '[bot]') &&
        (
          github.event.issue.author_association == 'OWNER' ||
          github.event.issue.author_association == 'MEMBER' ||
          github.event.issue.author_association == 'COLLABORATOR'
        ) &&
        !contains(github.event.issue.labels.*.name, 'needs-triage') &&
        !contains(github.event.issue.labels.*.name, 'needs-info') &&
        !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
        !contains(github.event.issue.labels.*.name, 'ready-for-human') &&
        !contains(github.event.issue.labels.*.name, 'wontfix')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: triage-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      # The deepseek free tier hit its usage limit, so triage uses another free
      # model. Override with the TRIAGE_MODEL repository variable if needed.
      MODEL: ${{ vars.TRIAGE_MODEL || 'opencode/glm-5.3-flash-free' }}
      OPENCODE_VERSION: '2.2.6'
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_DISABLE_AUTOUPDATE: 'true'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      ISSUE_URL: ${{ github.event.issue.html_url || format('https://github.com/{0}/issues/{1}', github.repository, inputs.issue_number) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # opencode/github@latest only accepts issue_comment and
      # pull_request_review_comment events, so it cannot run on issues:opened.
      # Call the CLI directly and let the agent use gh for labels and comments.
      - name: Install OpenCode
        run: |
          set -euo pipefail
          npm install --global "@opencode/cli@${OPENCODE_VERSION}"
          opencode --version

      - name: Run opencode triage
        run: |
          set -euo pipefail
          # Quoted heredoc: the backticked gh commands belong to the agent and
          # must not run while the prompt is built. Only the placeholders below
          # are substituted.
          prompt=$(cat <<'PROMPT'
          Ты выполняешь первичный триаж нового issue в репозитории Callbook.
          Номер issue: __ISSUE_NUMBER__. URL: __ISSUE_URL__.

          1. Прочитай issue командой `gh issue view __ISSUE_NUMBER__` (заголовок,
             тело, автор, метки) и комментарии командой
             `gh issue view __ISSUE_NUMBER__ --comments`. Если комментариев нет,
             вторая команда ничего не выведет.
          2. Прочитай docs/agents/triage-labels.md и docs/agents/issue-tracker.md.
          3. Если у issue уже есть любая из меток needs-triage, needs-info,
             ready-for-agent, ready-for-human или wontfix, ничего не делай и
             заверши работу.
          4. Определи категорию (bug или enhancement) и ровно одно состояние:
             needs-triage, needs-info, ready-for-agent, ready-for-human или
             wontfix.
          5. Поставь метки командой
             `gh issue edit __ISSUE_NUMBER__ --add-label <категория> --add-label <состояние>`.
          6. Опубликуй итоги командой
             `gh issue comment __ISSUE_NUMBER__ --body-file <файл>`.
          7. Если данных не хватает, поставь needs-info и задай автору
             конкретные вопросы по шаблону Triage Notes.
          8. Если задача полностью специфицирована и мала, напиши краткий
             agent brief и поставь ready-for-agent.
          9. Если нужны ручные действия, визуальная проверка или решение
             человека, поставь ready-for-human и объясни почему.
          10. Если запрос дублирует существующее поведение, отклонён или уже
              реализован, объясни это, поставь wontfix и закрой issue командой
              `gh issue close __ISSUE_NUMBER__ --reason "not planned"`.
          11. Не меняй код, не создавай ветки и pull request. Работай только с
              issue: комментарии, метки, закрытие.
          12. Каждый комментарий начинай строкой:
              > *This was generated by AI during triage.*
          13. Не добавляй больше одной категории и больше одного состояния.
          PROMPT
          )
          prompt=${prompt//__ISSUE_NUMBER__/$ISSUE_NUMBER}
          prompt=${prompt//__ISSUE_URL__/$ISSUE_URL}
          timeout 900 opencode run --standalone --auto --model "$MODEL" "$prompt"

      - name: Verify the triage result
        run: |
          set -euo pipefail
          labels=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name]')
          states=$(jq '[.[] | select(. == "needs-triage" or . == "needs-info" or . == "ready-for-agent" or . == "ready-for-human" or . == "wontfix")] | length' <<<"$labels")
          categories=$(jq '[.[] | select(. == "bug" or . == "enhancement")] | length' <<<"$labels")
          comments=$(gh issue view "$ISSUE_NUMBER" --json comments \
            --jq '[.comments[] | select(.body | startswith("> *This was generated by AI during triage.*"))] | length')

          echo "state labels: ${states}, category labels: ${categories}, triage comments: ${comments}"
          if [ "$states" -ne 1 ]; then
            echo "::error::Expected exactly one triage state label, found ${states}."
            exit 1
          fi
          if [ "$categories" -ne 1 ]; then
            echo "::error::Expected exactly one category label (bug or enhancement), found ${categories}."
            exit 1
          fi
          if [ "$comments" -lt 1 ]; then
            echo "::error::The agent did not post a comment with the triage marker."
            exit 1
          fi
