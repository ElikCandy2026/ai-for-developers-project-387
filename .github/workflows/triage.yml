name: triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: |
      github.event.issue.user.type != 'Bot' &&
      !endsWith(github.event.issue.user.login, '[bot]') &&
      (
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR'
      ) &&
      !contains(github.event.issue.labels.*.name, 'needs-triage') &&
      !contains(github.event.issue.labels.*.name, 'needs-info') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-human') &&
      !contains(github.event.issue.labels.*.name, 'wontfix')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run opencode triage
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See review.yml: the action reads TOKEN, not USE_GITHUB_TOKEN.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          use_github_token: true
          share: false
          prompt: |
            Ты выполняешь первичный триаж нового issue в репозитории Callbook.

            1. Прочитай issue: заголовок, тело, автора, метки и комментарии.
            2. Прочитай docs/agents/triage-labels.md и docs/agents/issue-tracker.md.
            3. Если у issue уже есть любая из меток needs-triage, needs-info,
               ready-for-agent, ready-for-human или wontfix, ничего не делай и
               заверши работу.
            4. Определи категорию (bug или enhancement) и ровно одно состояние:
               needs-triage, needs-info, ready-for-agent, ready-for-human или
               wontfix.
            5. Если данных не хватает, поставь needs-info и опубликуй комментарий
               по шаблону Triage Notes с конкретными вопросами автору.
            6. Если задача полностью специфицирована и мала, напиши краткий
               agent brief и поставь ready-for-agent.
            7. Если нужны ручные действия, визуальная проверка или решение
               человека, поставь ready-for-human и объясни почему.
            8. Если запрос дублирует существующее поведение, отклонён или уже
               реализован, объясни это и закрой issue с wontfix.
            9. Не меняй код, не создавай ветки и pull request. Работай только с
               issue: комментарии, метки, закрытие.
            10. Каждый комментарий начинай строкой:
                > *This was generated by AI during triage.*
            11. Не добавляй больше одной категории и больше одного состояния.
