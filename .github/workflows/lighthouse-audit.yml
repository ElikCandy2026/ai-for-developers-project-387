name: lighthouse-audit

on:
  schedule:
    # GitHub Actions evaluates cron in UTC unless timezone is set. With the
    # explicit timezone the audit runs at 03:17 Europe/Moscow, once per day.
    - cron: '17 3 * * *'
      timezone: Europe/Moscow
  workflow_dispatch:
    inputs:
      mode:
        description: 'Источник отчёта: реальный аудит, подготовленный учебный, baseline или повторное появление'
        required: true
        default: live
        type: choice
        options:
          - live
          - training
          - baseline
          - regression
      target:
        description: 'Где измерять: локальная сборка на чистой БД или развёрнутый стенд Render'
        required: true
        default: local
        type: choice
        options:
          - local
          - render

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: lighthouse-audit
      cancel-in-progress: false
    permissions:
      # GITHUB_TOKEN mode (the CLI equivalent of use_github_token: true):
      # the agent uses GH_TOKEN to search and create issues. No id-token is
      # needed because no GitHub App token exchange is performed.
      contents: read
      issues: write
    env:
      MODE: ${{ inputs.mode || 'live' }}
      TARGET: ${{ inputs.target || 'local' }}
      # Public stand of this repository. Override with the RENDER_URL
      # repository variable if the service is recreated.
      RENDER_URL: ${{ vars.RENDER_URL || 'https://ai-for-developers-project-387-6sa3.onrender.com/' }}
      # Ignored by git, so audit reports never reach a commit.
      REPORT_DIR: ${{ github.workspace }}/lighthouse-report
      AUDIT_URL: ${{ (inputs.target || 'local') == 'render' && (vars.RENDER_URL || 'https://ai-for-developers-project-387-6sa3.onrender.com/') || 'http://127.0.0.1:8080/' }}
      ARTIFACT_NAME: lighthouse-report
      AUDIT_LABEL: lighthouse-audit
      TRAINING_LABEL: training
      LOG_LABEL: lighthouse-log
      REGRESSION_LABEL: lighthouse-regression
      # Registry of previously fixed findings: audit id -> issue, fix PR/commit.
      # A registered audit that fails again is a recurrence, not a new finding.
      REGRESSION_REGISTRY: ${{ github.workspace }}/.github/lighthouse-fixed-audits.json
      # regression mode reproduces this fixed finding by starting the app with
      # compression disabled. The audit must detect it and link the fix.
      REGRESSION_AUDIT_ID: uses-text-compression
      # Baseline mode repeats Lighthouse to smooth out runner noise.
      BASELINE_RUNS: '5'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate target
        run: |
          set -euo pipefail
          # Normalise the base URL so "${AUDIT_URL}api/owner" always works,
          # even when RENDER_URL is set without a trailing slash.
          echo "AUDIT_URL=${AUDIT_URL%/}/" >> "$GITHUB_ENV"
          echo "mode=${MODE} target=${TARGET} url=${AUDIT_URL%/}/"
          if [ "$MODE" = "regression" ] && [ "$TARGET" != "local" ]; then
            echo "::error::Режим regression требует target=local: дефект воспроизводится отключением сжатия в локальной сборке."
            exit 1
          fi

      # Labels and the audit log issue are created before the build so a later
      # failure (for example, the app did not start) can still be recorded as
      # "no data" instead of disappearing with the failed job.
      - name: Ensure labels and audit log issue
        if: env.MODE != 'baseline'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "$AUDIT_LABEL" \
            --description "Находка автоматического аудита Lighthouse" \
            --color 0e8a16 --force >/dev/null
          gh label create "$TRAINING_LABEL" \
            --description "Учебная задача, не подтверждённый дефект" \
            --color fbca04 --force >/dev/null
          gh label create "$REGRESSION_LABEL" \
            --description "Повторное появление ранее исправленной находки" \
            --color b60205 --force >/dev/null
          gh label create "$LOG_LABEL" \
            --description "Журнал запусков аудита Lighthouse" \
            --color 1d76db --force >/dev/null
          log_issue=$(gh issue list --state open --label "$LOG_LABEL" \
            --json number --jq '.[0].number // empty')
          if [ -z "$log_issue" ]; then
            # Take the number from the created URL: listing by label right
            # after creation can race with GitHub's label index.
            log_url=$(gh issue create \
              --title "Lighthouse: журнал аудитов" \
              --label "$LOG_LABEL" \
              --body "Журнал автоматических аудитов Lighthouse. Агент пишет сюда итог каждого прогона: находка, её отсутствие или отсутствие данных. Issue не закрывать.")
            log_issue=${log_url##*/}
          fi
          test -n "$log_issue"
          echo "AUDIT_LOG_ISSUE=$log_issue" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install dependencies
        if: env.MODE != 'training' && env.TARGET == 'local'
        run: |
          set -euo pipefail
          cd contract && npm ci
          cd ../frontend && npm ci

      - name: Build application
        if: env.MODE != 'training' && env.TARGET == 'local'
        run: make build

      - name: Start application
        if: env.MODE != 'training' && env.TARGET == 'local'
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          # regression mode deliberately reintroduces the gzip defect fixed in
          # #23 by disabling the compression that the fix enabled. The audit
          # must notice the recurrence and link the fixing PR and the issue.
          compression=true
          if [ "$MODE" = "regression" ]; then
            compression=false
          fi
          PORT=8080 \
          DB_PATH="$REPORT_DIR/callbook.db" \
          SEED_DEMO_DATA=true \
          SERVER_COMPRESSION_ENABLED="$compression" \
          nohup java -jar backend/target/call-booking-1.0.0.jar \
            > "$REPORT_DIR/app.log" 2>&1 &
          echo "$!" > "$REPORT_DIR/app.pid"
          for _ in $(seq 1 60); do
            if curl -sf "${AUDIT_URL}api/owner" >/dev/null; then
              echo "Application is up at ${AUDIT_URL} (compression=${compression})"
              exit 0
            fi
            sleep 2
          done
          reason="приложение не ответило на ${AUDIT_URL}api/owner за 120 с"
          echo "no-data: ${reason}" > "$REPORT_DIR/no-data.txt"
          echo "NO_DATA_REASON=${reason}" >> "$GITHUB_ENV"
          echo "Application did not start in time" >&2
          tail -100 "$REPORT_DIR/app.log" >&2 || true
          exit 1

      - name: Verify regression fixture
        if: env.MODE == 'regression'
        run: |
          set -euo pipefail
          # A regression run is only meaningful if the defect is really back.
          # If compression is still enabled, the run proves nothing about the
          # audit and must be recorded as missing data, not as "fixed".
          asset=$(curl -sf "$AUDIT_URL" | grep -oE '/assets/[^"]+\.js' | head -1)
          if [ -z "$asset" ]; then
            reason="не удалось найти JS-ассет на главной странице"
          else
            headers=$(curl -sS -D - -o /dev/null -H 'Accept-Encoding: gzip' \
              "${AUDIT_URL%/}${asset}")
            if printf '%s' "$headers" | grep -qi '^content-encoding: gzip'; then
              reason="сжатие всё ещё включено для ${asset}; дефект не воспроизведён"
            else
              echo "Compression is disabled for ${asset}; the #23 defect is reproduced."
              exit 0
            fi
          fi
          echo "no-data: ${reason}" > "$REPORT_DIR/no-data.txt"
          echo "NO_DATA_REASON=${reason}" >> "$GITHUB_ENV"
          echo "$reason" >&2
          exit 1

      - name: Wait for Render
        if: env.TARGET == 'render' && env.MODE != 'training'
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          # On the free plan the instance sleeps after idle and the first
          # request can take up to a minute. An unavailable stand is missing
          # data, not a clean report: it does not prove that a fix holds.
          for _ in $(seq 1 60); do
            if curl -sf "${AUDIT_URL}api/owner" >/dev/null; then
              echo "Render is up at ${AUDIT_URL}"
              exit 0
            fi
            sleep 3
          done
          reason="стенд Render ${AUDIT_URL} недоступен: /api/owner не ответил за 180 с"
          echo "no-data: ${reason}" > "$REPORT_DIR/no-data.txt"
          echo "NO_DATA_REASON=${reason}" >> "$GITHUB_ENV"
          echo "$reason" >&2
          exit 1

      - name: Run Lighthouse
        if: env.MODE != 'training'
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          trap 'reason="Lighthouse не снял отчёт"; echo "no-data: ${reason}" > "$REPORT_DIR/no-data.txt"; echo "NO_DATA_REASON=${reason}" >> "$GITHUB_ENV"' ERR
          # The first Lighthouse pass runs while Spring Boot is still warming up
          # (JIT, class loading) and competes with it for CPU. Discard a warm-up
          # pass so the measured runs describe the steady state.
          npx --yes lighthouse@12 "$AUDIT_URL" \
            --quiet \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu" \
            --output=json \
            --output-path="$REPORT_DIR/warmup" \
            --only-categories=performance
          if [ -f "$REPORT_DIR/warmup" ]; then
            mv "$REPORT_DIR/warmup" "$REPORT_DIR/warmup.report.json"
          fi
          runs=1
          if [ "$MODE" = "baseline" ]; then
            runs=$BASELINE_RUNS
          fi
          for i in $(seq 1 "$runs"); do
            if [ "$MODE" = "baseline" ]; then
              output_base="$REPORT_DIR/run-$i"
            else
              output_base="$REPORT_DIR/report"
            fi
            npx --yes lighthouse@12 "$AUDIT_URL" \
              --quiet \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu" \
              --output=json \
              --output=html \
              --output-path="$output_base" \
              --only-categories=performance,accessibility,best-practices,seo
            if [ "$MODE" = "baseline" ]; then
              test -f "$output_base.report.json"
              test -f "$output_base.report.html"
            fi
          done
          if [ "$MODE" = "baseline" ]; then
            # Keep a stable pair of files for the artifact and manual review.
            cp "$REPORT_DIR/run-1.report.json" "$REPORT_DIR/report.json"
            cp "$REPORT_DIR/run-1.report.html" "$REPORT_DIR/report.html"
          else
            # With two output formats Lighthouse appends the format to the base
            # name. Normalise both files so later steps have stable paths.
            json_report=$(find "$REPORT_DIR" -maxdepth 1 -name 'report*.json' | head -1)
            html_report=$(find "$REPORT_DIR" -maxdepth 1 -name 'report*.html' | head -1)
            test -n "$json_report"
            test -n "$html_report"
            cp "$json_report" "$REPORT_DIR/report.json"
            cp "$html_report" "$REPORT_DIR/report.html"
          fi

      - name: Summarize baseline
        if: env.MODE == 'baseline'
        run: |
          set -euo pipefail
          python3 - "$REPORT_DIR" <<'PY'
          import glob
          import json
          import os
          import statistics
          import sys

          report_dir = sys.argv[1]
          paths = sorted(glob.glob(os.path.join(report_dir, 'run-*.report.json')))
          runs = [json.load(open(path, encoding='utf-8')) for path in paths]
          if not runs:
              raise SystemExit('no baseline reports found')

          def audit(run, audit_id):
              return run['audits'].get(audit_id) or {}

          def number(run, audit_id):
              return audit(run, audit_id).get('numericValue', 0)

          def savings(run, audit_id, key):
              details = audit(run, audit_id).get('details') or {}
              return details.get(key, 0)

          metrics = [
              ('Performance', lambda run: run['categories']['performance']['score'] * 100, ''),
              ('Accessibility', lambda run: run['categories']['accessibility']['score'] * 100, ''),
              ('FCP', lambda run: number(run, 'first-contentful-paint'), 'ms'),
              ('LCP', lambda run: number(run, 'largest-contentful-paint'), 'ms'),
              ('TBT', lambda run: number(run, 'total-blocking-time'), 'ms'),
              ('Max potential FID', lambda run: number(run, 'max-potential-fid'), 'ms'),
              ('Speed Index', lambda run: number(run, 'speed-index'), 'ms'),
              ('TTI', lambda run: number(run, 'interactive'), 'ms'),
              ('CLS', lambda run: number(run, 'cumulative-layout-shift'), ''),
              ('Main-thread work', lambda run: number(run, 'mainthread-work-breakdown'), 'ms'),
              ('Bootup time', lambda run: number(run, 'bootup-time'), 'ms'),
              ('Unused JS', lambda run: savings(run, 'unused-javascript', 'overallSavingsBytes') / 1024, 'KiB'),
              ('Unused CSS', lambda run: savings(run, 'unused-css-rules', 'overallSavingsBytes') / 1024, 'KiB'),
              ('Render-blocking', lambda run: savings(run, 'render-blocking-resources', 'overallSavingsMs'), 'ms'),
              ('Total transfer', lambda run: number(run, 'total-byte-weight') / 1024, 'KiB'),
              ('Text compression savings', lambda run: savings(run, 'uses-text-compression', 'overallSavingsBytes') / 1024, 'KiB'),
              ('Long tasks', lambda run: len((audit(run, 'long-tasks').get('details') or {}).get('items') or []), ''),
          ]

          def fmt(value):
              return f'{value:.1f}' if isinstance(value, float) else str(value)

          lines = [
              '# Lighthouse baseline',
              '',
              f'- Прогонов: {len(runs)}',
              '- Прогревочный прогон: 1 (исключён из метрик)',
              f'- Lighthouse: {runs[0].get("lighthouseVersion", "unknown")}',
              f'- Benchmark index: {runs[0].get("environment", {}).get("benchmarkIndex", "unknown")}',
              f'- URL: {runs[0].get("finalDisplayedUrl", runs[0].get("finalUrl", ""))}',
              f'- Время: {runs[0].get("fetchTime", "")} — {runs[-1].get("fetchTime", "")}',
              '',
              '| Метрика | ' + ' | '.join(f'run {i + 1}' for i in range(len(runs))) + ' | Медиана | Min | Max |',
              '| --- | ' + ' | '.join('---:' for _ in runs) + ' | ---: | ---: | ---: |',
          ]
          for name, getter, unit in metrics:
              values = [getter(run) for run in runs]
              suffix = f' {unit}' if unit else ''
              cells = ' | '.join(fmt(value) for value in values)
              lines.append(
                  f'| {name} | {cells} | {fmt(statistics.median(values))}{suffix} | '
                  f'{fmt(min(values))}{suffix} | {fmt(max(values))}{suffix} |'
              )

          groups = {}
          for run in runs:
              items = (audit(run, 'mainthread-work-breakdown').get('details') or {}).get('items') or []
              for item in items:
                  groups.setdefault(item['groupLabel'], []).append(item['duration'])
          lines.extend(['', '### Main-thread breakdown (медиана)', '', '| Группа | ms |', '| --- | ---: |'])
          for label, values in sorted(groups.items(), key=lambda pair: -statistics.median(pair[1])):
              lines.append(f'| {label} | {statistics.median(values):.1f} |')

          summary = '\n'.join(lines) + '\n'
          with open(os.path.join(report_dir, 'baseline-summary.md'), 'w', encoding='utf-8') as handle:
              handle.write(summary)
          print(summary)
          PY
          cat "$REPORT_DIR/baseline-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare training report
        if: env.MODE == 'training'
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          jq -n --arg fetched_at "$(date -u +%FT%TZ)" '{
            trainingFixture: true,
            trainingNote: "Подготовленный учебный отчёт. Это не результат реального аудита приложения и не подтверждённый дефект.",
            lighthouseVersion: "training-fixture",
            fetchTime: $fetched_at,
            requestedUrl: "http://127.0.0.1:8080/",
            finalUrl: "http://127.0.0.1:8080/",
            categories: {
              performance: {id: "performance", title: "Performance", score: 0.38},
              accessibility: {id: "accessibility", title: "Accessibility", score: 0.92},
              "best-practices": {id: "best-practices", title: "Best Practices", score: 0.96},
              seo: {id: "seo", title: "SEO", score: 0.90}
            },
            audits: {
              "largest-contentful-paint": {
                id: "largest-contentful-paint",
                title: "Largest Contentful Paint",
                description: "Largest Contentful Paint marks the time at which the largest text or image is painted.",
                score: 0.21,
                scoreDisplayMode: "numeric",
                numericValue: 5200,
                displayValue: "5.2 s",
                details: {
                  type: "opportunity",
                  overallSavingsMs: 3400,
                  items: [
                    {
                      node: {
                        selector: "main .spotlight",
                        snippet: "<aside class=\"spotlight\">"
                      }
                    }
                  ]
                }
              },
              "render-blocking-resources": {
                id: "render-blocking-resources",
                title: "Eliminate render-blocking resources",
                score: 0.55,
                scoreDisplayMode: "numeric",
                displayValue: "Potential savings of 620 ms"
              }
            }
          }' > "$REPORT_DIR/report.json"
          cat > "$REPORT_DIR/report.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Учебный отчёт Lighthouse</title>
          <h1>Учебный отчёт Lighthouse</h1>
          <p><strong>Это подготовленный учебный отчёт, а не результат реального аудита.</strong></p>
          <p>LCP: 5.2 s, performance: 38.</p>
          HTML

      - name: Summarize report
        if: env.MODE != 'baseline'
        run: |
          set -euo pipefail
          jq -r '
            "# Lighthouse: \(.finalUrl // .requestedUrl)\n\n" +
            (if .trainingFixture then "> **Учебный отчёт.** Подготовленная находка, не подтверждённый дефект приложения.\n\n" else "" end) +
            "| Категория | Оценка |\n| --- | --- |\n" +
            ([.categories | to_entries[] |
              "| \(.value.title) | \(if .value.score == null then "n/a" else ((.value.score * 100) | round | tostring) end) |"
             ] | join("\n")) +
            "\n\n## Находки\n\n" +
            ([.audits | to_entries[] |
              select(.value.score != null and .value.score < 1) |
              select(.value.scoreDisplayMode == "binary" or .value.scoreDisplayMode == "numeric" or .value.scoreDisplayMode == "metricSavings") |
              "- `\(.key)` — \(.value.title): \(.value.displayValue // (.value.score | tostring))"
             ] | join("\n"))
          ' "$REPORT_DIR/report.json" > "$REPORT_DIR/summary.md"
          cat "$REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Registered findings are checked without the model: a recurrence must
      # always be linked to the issue and the PR/commit that fixed it, even
      # when the agent is unavailable. Unregistered findings still go to the
      # agent below.
      - name: Check registered regressions
        if: env.MODE != 'training' && env.MODE != 'baseline'
        id: regression
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          python3 - "$REPORT_DIR" "$REGRESSION_REGISTRY" <<'PY'
          import json
          import os
          import subprocess
          import sys

          report_dir, registry_path = sys.argv[1], sys.argv[2]
          mode = os.environ.get("MODE", "live")
          repo = os.environ["GH_REPO"]
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          audit_label = os.environ["AUDIT_LABEL"]
          regression_label = os.environ["REGRESSION_LABEL"]
          expected = os.environ.get("REGRESSION_AUDIT_ID", "")

          def gh(*args):
              return subprocess.run(
                  ["gh", *args], check=True, text=True, capture_output=True
              ).stdout.strip()

          def write_result(result, reason="", issue=""):
              with open(os.path.join(report_dir, "regression-result.txt"), "w", encoding="utf-8") as handle:
                  handle.write(result + (" " + reason if reason else "") + "\n")
              outputs = {
                  "skip_agent": "true" if result != "none" else "false",
                  "no_data": "true" if result == "no-data" else "false",
                  "failed": "true" if result == "error" else "false",
                  "issue": issue,
                  "reason": reason,
              }
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  for key, value in outputs.items():
                      handle.write(f"{key}={value}\n")
              if result == "no-data":
                  with open(os.path.join(report_dir, "no-data.txt"), "w", encoding="utf-8") as handle:
                      handle.write(f"no-data: {reason}\n")
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                      handle.write(f"NO_DATA_REASON={reason}\n")
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as handle:
                      if result == "none":
                          handle.write("\n### Повторное появление\n\nЗарегистрированных повторов нет.\n")
                      elif result == "no-data":
                          handle.write(f"\n### Повторное появление\n\n**Данных нет:** {reason}. Это не подтверждает, что дефект исправлен.\n")
                      elif result == "regression":
                          handle.write(f"\n### Повторное появление\n\nСоздана или обновлена задача: {issue}\n")
                      else:
                          handle.write(f"\n### Повторное появление\n\n**Ошибка проверки:** {reason}\n")

          report_path = os.path.join(report_dir, "report.json")
          try:
              with open(report_path, encoding="utf-8") as handle:
                  report = json.load(handle)
          except FileNotFoundError:
              write_result("no-data", "отчёт Lighthouse не создан")
              sys.exit(0)
          except (OSError, json.JSONDecodeError) as error:
              write_result("no-data", f"отчёт Lighthouse не читается: {error}")
              sys.exit(0)

          if report.get("runtimeError"):
              error = report["runtimeError"]
              message = error.get("message") if isinstance(error, dict) else str(error)
              write_result("no-data", f"Lighthouse вернул runtimeError: {message}")
              sys.exit(0)
          audits = report.get("audits") or {}
          if not audits:
              write_result("no-data", "в отчёте нет ни одного аудита")
              sys.exit(0)
          audited_url = (
              report.get("finalDisplayedUrl")
              or report.get("finalUrl")
              or os.environ.get("AUDIT_URL", "")
          )

          try:
              with open(registry_path, encoding="utf-8") as handle:
                  registry = json.load(handle)
          except (OSError, json.JSONDecodeError) as error:
              write_result("error", f"реестр исправленных находок не читается: {error}")
              sys.exit(0)

          recurrences = []
          for audit_id, entry in registry.items():
              audit = audits.get(audit_id)
              if not audit or audit.get("score") is None:
                  continue
              if audit.get("scoreDisplayMode") in ("notApplicable", "manual", "informational"):
                  continue
              if audit["score"] < 1:
                  recurrences.append((audit_id, entry, audit))

          if mode == "regression" and expected and not any(a == expected for a, _, _ in recurrences):
              write_result(
                  "no-data",
                  f"режим regression не воспроизвёл {expected}; отсутствие находки здесь не подтверждает исправление",
              )
              sys.exit(0)

          if not recurrences:
              write_result("none")
              sys.exit(0)

          created = []
          for audit_id, entry, audit in recurrences:
              issue_number = entry["issue"]
              fix_pr = entry.get("fixPr")
              fix_commit = entry.get("fixCommit")
              issue_url = f"https://github.com/{repo}/issues/{issue_number}"
              fix_lines = [f"- Прежняя задача: #{issue_number} — {issue_url}"]
              if fix_pr:
                  fix_lines.append(f"- Исправляющий PR: #{fix_pr} — https://github.com/{repo}/pull/{fix_pr}")
              if fix_commit:
                  fix_lines.append(f"- Коммит исправления: https://github.com/{repo}/commit/{fix_commit}")
              if not fix_pr and not fix_commit:
                  fix_lines.append("- Исправляющий PR: не найден (в реестре нет ссылки)")
              body = "\n".join([
                  "## Повторное появление",
                  "",
                  f"Ранее исправленная находка `{audit_id}` снова воспроизводится на "
                  f"{audited_url}.",
                  "",
                  *fix_lines,
                  f"- Было после исправления: {entry.get('fixedValue', 'не зафиксировано')}",
                  f"- Где было исправлено: {entry.get('page', 'не зафиксировано')}",
                  f"- Сейчас: {audit.get('displayValue') or audit.get('score')} (score {audit.get('score')})",
                  f"- Прогон: {run_url}",
                  f"- Режим: `{mode}`",
                  "",
                  "## Предлагаемое действие",
                  "",
                  f"Проверить, не откатилось ли исправление из #{issue_number}, и повторить "
                  "проверку после правки. Проблема считается исправленной только по данным "
                  "нового прогона, а не по отсутствию задачи.",
                  "",
                  "## Связь с отчётом",
                  "",
                  f"- Audit id: `{audit_id}`",
                  f"- Страница: {audited_url}",
                  f"- Коммит: {os.environ.get('GITHUB_SHA', 'unknown')}",
                  f"- Артефакт: {os.environ.get('ARTIFACT_NAME', 'lighthouse-report')}",
                  "",
              ])
              if mode == "regression":
                  body += (
                      "\n> **Проверка аудита.** В режиме `regression` дефект воспроизведён "
                      "намеренно: приложение запущено без сжатия. Это подтверждает, что "
                      "аудит замечает повторное появление, и не означает регресс в `main`.\n"
                  )
              title = (
                  f"Lighthouse: повторное появление {audit_id} — "
                  f"{audit.get('title') or 'находка вернулась'}"
              )
              body_path = os.path.join(report_dir, f"regression-{audit_id}.md")
              with open(body_path, "w", encoding="utf-8") as handle:
                  handle.write(body)
              existing = json.loads(
                  gh(
                      "issue", "list",
                      "--state", "open",
                      "--label", regression_label,
                      "--search", f"{audit_id} in:title,body",
                      "--json", "number,url",
                  ) or "[]"
              )
              if existing:
                  url = existing[0]["url"]
                  gh("issue", "comment", str(existing[0]["number"]), "--body-file", body_path)
              else:
                  url = gh(
                      "issue", "create",
                      "--title", title,
                      "--body-file", body_path,
                      "--label", audit_label,
                      "--label", regression_label,
                  )
              created.append(url)

          log_issue = os.environ.get("AUDIT_LOG_ISSUE")
          if log_issue:
              finding_list = ", ".join(f"`{audit_id}`" for audit_id, _, _ in recurrences)
              journal = "\n".join([
                  "### Повторное появление",
                  "",
                  f"- Режим: `{mode}`",
                  f"- Находки: {finding_list}",
                  f"- Задачи: {', '.join(created)}",
                  f"- Прогон: {run_url}",
              ])
              journal_path = os.path.join(report_dir, "regression-journal.md")
              with open(journal_path, "w", encoding="utf-8") as handle:
                  handle.write(journal + "\n")
              gh("issue", "comment", log_issue, "--body-file", journal_path)

          write_result("regression", issue=", ".join(created))
          PY

      - name: Verify regression result
        if: steps.regression.outputs.skip_agent == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.regression.outputs.no_data }}" = "true" ]; then
            echo "::error::Данных нет: ${{ steps.regression.outputs.reason }}. Это не подтверждает, что дефект исправлен."
            exit 1
          fi
          if [ "${{ steps.regression.outputs.failed }}" = "true" ]; then
            echo "::error::Проверка повторного появления не выполнена: ${{ steps.regression.outputs.reason }}"
            exit 1
          fi
          echo "Повторное появление: ${{ steps.regression.outputs.issue }}"

      - name: Build agent prompt
        if: env.MODE != 'baseline' && steps.regression.outputs.skip_agent != 'true'
        run: |
          set -euo pipefail
          cat > "$REPORT_DIR/prompt.md" <<EOF
          Ты — агент автоматического аудита Lighthouse в репозитории Callbook.
          Не меняй код, не создавай коммиты, ветки и pull request. Работай только
          с GitHub issues.

          Контекст прогона:
          - Режим: ${MODE}
          - Страница: ${AUDIT_URL}
          - Прогон: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Коммит: ${GITHUB_SHA}
          - Артефакт: ${ARTIFACT_NAME} (JSON и HTML, срок хранения ограничен)
          - Отчёт: ${REPORT_DIR}/report.json
          - Сводка: ${REPORT_DIR}/summary.md
          - Журнал аудитов: issue #${AUDIT_LOG_ISSUE}

          Порядок работы:
          1. Прочитай report.json и summary.md. Если отчёта нет, он пуст, содержит
             runtimeError или в нём нет раздела audits, это отсутствие данных, а не
             подтверждение исправления. Запиши \`no-data <причина>\`, не создавай
             issue и не пиши, что дефект исправлен.
          2. Если в отчёте trainingFixture=true, это учебный отчёт: явно обозначь
             это в задаче.
          3. Выбери ровно одну самую значимую конкретную находку. Нужны audit id,
             значение и затронутая страница. Не создавай задачу на общий низкий
             score без конкретной метрики или правила.
          4. Найди дубли командой:
             gh issue list --state open --label ${AUDIT_LABEL} --search "<audit id> in:title,body" --json number,title,url,labels
             В режиме training дополнительно используй --label ${TRAINING_LABEL}.
             В режиме live игнорируй задачи с меткой ${TRAINING_LABEL}.
             Дубль — только задача про тот же audit id и ту же страницу/проблему.
          5. Отдельно проверь, не является ли находка повторным появлением уже
             исправленной проблемы. Найди закрытые задачи:
             gh issue list --state closed --label ${AUDIT_LABEL} --search "<audit id> in:title,body" --json number,title,url,closedAt
             Если закрытая задача с тем же audit id есть, найди исправляющий PR:
             gh pr list --state merged --search "<номер задачи> in:title,body" --json number,title,url
             Если PR не найден, найди коммит:
             git log --all --oneline --grep "#<номер задачи>"
             В новом issue добавь раздел \`## Повторное появление\` со ссылками на
             прежнюю задачу и исправляющий PR (или коммит, если PR не было), а
             также строку о том, что именно было исправлено и какое значение было
             после исправления. Добавь метку ${REGRESSION_LABEL}. Если ни PR, ни
             коммит найти не удалось, так и напиши: отсутствие ссылки не отменяет
             находку и не доказывает, что дефект исправлен.
          6. Если дубль есть и новых сведений нет (та же метрика, тот же масштаб),
             ничего не создавай и не комментируй. Запиши результат duplicate.
          7. Если дубля нет, создай отдельный issue через gh issue create:
             - заголовок: \`Lighthouse: <audit id> — <кратко>\`;
               в режиме training начни с \`[Учебный аудит] \`;
             - метки: ${AUDIT_LABEL}, в режиме training ещё ${TRAINING_LABEL};
               при повторном появлении ещё ${REGRESSION_LABEL};
             - тело с разделами \`## Проблема\`, \`## Предлагаемое действие\`,
               \`## Связь с отчётом\`: ссылка на прогон, имя артефакта, audit id,
               значение, страница и коммит;
             - в training добавь строку
               \`> **Учебная задача.** Подготовленный учебный отчёт, не подтверждённый дефект приложения.\`
             Многострочное тело передавай через --body-file, не через --body.
          8. Если находок нет, добавь в журнал #${AUDIT_LOG_ISSUE} комментарий:
             оценки категорий, вывод «Находок нет» и ссылку на прогон. Отсутствие
             находки не доказывает, что ранее исправленный дефект исправлен: это
             утверждение делается только по данным прогона.
          9. Если задача создана, добавь в журнал #${AUDIT_LOG_ISSUE} один короткий
             комментарий: режим, оценка performance, ссылка на созданный issue и
             прогон. При дубле комментарий в журнал не добавляй.
          10. Запиши в ${REPORT_DIR}/agent-result.txt ровно одну строку:
              \`created <url issue>\`, \`duplicate #<n>\`, \`no-findings\`,
              \`no-data <причина>\` или \`error <кратко>\`.
          11. В конце выведи короткий итог: \`ISSUE: <url>\`, \`DUPLICATE: #<n>\`,
              \`NO_FINDINGS\`, \`NO_DATA: <причина>\` или \`ERROR: <кратко>\`, и
              одну строку с находкой. Пиши по-русски.
          EOF

      - name: Run audit agent
        if: env.MODE != 'baseline' && steps.regression.outputs.skip_agent != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          # The free model can answer "Free usage limit reached" with a
          # retry-after of many hours and keep retrying. Bound the call so a
          # missing agent result is recorded as "no data" instead of hanging
          # the job until the global timeout.
          status=0
          timeout --signal=TERM 600 opencode run \
            --auto \
            --model opencode/deepseek-v4.1-flash-free \
            --title "Lighthouse ${MODE} ${GITHUB_RUN_ID}" \
            "$(cat "$REPORT_DIR/prompt.md")" \
            2>&1 | tee "$REPORT_DIR/agent-output.log" || status=$?
          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$REPORT_DIR/agent-output.log" \
            > "$REPORT_DIR/agent-output.md"
          cat "$REPORT_DIR/agent-output.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            if grep -qi "Free usage limit reached" "$REPORT_DIR/agent-output.log"; then
              reason="лимит бесплатной модели исчерпан, отчёт не разобран"
            elif [ "$status" -eq 124 ] || [ "$status" -eq 143 ]; then
              reason="агент не разобрал отчёт за 10 минут"
            else
              reason="агент завершился с кодом ${status}, отчёт не разобран"
            fi
            echo "no-data: ${reason}" > "$REPORT_DIR/no-data.txt"
            echo "NO_DATA_REASON=${reason}" >> "$GITHUB_ENV"
            exit "$status"
          fi

      - name: Verify agent result
        if: env.MODE != 'baseline' && steps.regression.outputs.skip_agent != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          result_file="$REPORT_DIR/agent-result.txt"
          if [ ! -s "$result_file" ]; then
            reason="агент не записал результат в ${result_file}"
            echo "no-data: ${reason}" > "$REPORT_DIR/no-data.txt"
            echo "NO_DATA_REASON=${reason}" >> "$GITHUB_ENV"
            echo "$reason" >&2
            exit 1
          fi
          result=$(head -1 "$result_file")
          echo "Агент: $result"
          case "$result" in
            created\ *|duplicate\ \#*|no-findings|no-data\ *|error\ *) ;;
            *)
              echo "Неизвестный результат агента: $result" >&2
              exit 1
              ;;
          esac
          if [[ "$result" == no-data* ]]; then
            reason=${result#no-data}
            reason=${reason# }
            reason=${reason:-агент не получил данных из отчёта}
            echo "no-data: ${reason}" > "$REPORT_DIR/no-data.txt"
            echo "NO_DATA_REASON=${reason}" >> "$GITHUB_ENV"
            echo "::error::Данных нет: ${reason}. Это не подтверждает, что дефект исправлен."
            exit 1
          fi
          if [[ "$result" == error* ]]; then
            echo "Агент завершился с ошибкой: $result" >&2
            exit 1
          fi
          if [[ "$result" == created\ * ]]; then
            issue_url=${result#created }
            gh issue view "$issue_url" --json number,title,url \
              --jq '"Проверен issue #\(.number): \(.title) — \(.url)"'
          fi

      - name: Record missing data
        if: failure() && env.MODE != 'training' && env.MODE != 'baseline'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          if [ -f "$REPORT_DIR/no-data-commented" ]; then
            echo "Отсутствие данных уже записано в журнал."
            exit 0
          fi
          reason="${NO_DATA_REASON:-}"
          if [ -z "$reason" ] && [ -f "$REPORT_DIR/no-data.txt" ]; then
            reason=$(sed -n 's/^no-data: //p' "$REPORT_DIR/no-data.txt" | head -1)
          fi
          reason="${reason:-шаг аудита завершился с ошибкой до получения отчёта}"
          log_issue="${AUDIT_LOG_ISSUE:-}"
          if [ -z "$log_issue" ]; then
            echo "Журнал аудитов не создан; причина отсутствия данных: ${reason}" >&2
            exit 0
          fi
          body=$(mktemp)
          cat > "$body" <<EOF
          ### Данных нет

          - Режим: \`${MODE}\`
          - Причина: ${reason}
          - Прогон: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Это не подтверждает, что дефект исправлен: без отчёта аудит не может
          отличить исправление от отсутствия данных.
          EOF
          gh issue comment "$log_issue" --body-file "$body"
          touch "$REPORT_DIR/no-data-commented"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT_DIR }}/
          retention-days: 14
          if-no-files-found: warn

      - name: Show application log on failure
        if: failure() && env.MODE != 'training' && env.TARGET == 'local'
        run: tail -100 "$REPORT_DIR/app.log" || true

      - name: Stop application
        if: always()
        run: |
          if [ -f "$REPORT_DIR/app.pid" ]; then
            kill "$(cat "$REPORT_DIR/app.pid")" || true
          fi
